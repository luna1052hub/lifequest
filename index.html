<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LIFE QUEST - RPG Todo</title>
  
  <meta name="theme-color" content="#1a1c23">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #2d313e;
      --accent-color: #f39c12;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --text-color: #ffffff;
      --border-color: #4a4e69;
      --gold-color: #ffd700;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      overflow: hidden; background-color: var(--bg-color) !important;
      color: var(--text-color); margin: 0; padding: 0;
    }

    .game-container {
      background: var(--card-bg); width: 100vw; height: 100vh; height: 100dvh;
      padding: 12px; padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; gap: 10px; justify-content: space-between; position: relative; overflow: hidden;
    }

    .top-header-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #21242d; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 11px; font-weight: 700;
    }

    .today-date-text { color: #f39c12; display: flex; align-items: center; gap: 5px; cursor: pointer; }

    .header-right-tools { display: flex; align-items: center; gap: 8px; }
    .streak-badge { background: #e67e22; color: #fff; padding: 3px 7px; border-radius: 12px; font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
    .gold-badge { background: #34495e; color: var(--gold-color); padding: 3px 7px; border-radius: 12px; font-size: 10px; font-weight: 700; border: 1px solid var(--gold-color); cursor: pointer; }

    .battle-stage-canvas-wrapper {
      background: #000; border-radius: 14px; border: 1px solid var(--border-color); position: relative; width: 100%; height: 175px; overflow: hidden; flex-shrink: 0;
    }

    canvas#gameCanvas { width: 100%; height: 100%; display: block; }

    .hero-profile-overlay {
      position: absolute; top: 6px; left: 10px; right: 10px; display: flex; align-items: center; gap: 8px; pointer-events: none; z-index: 5;
    }

    .hero-info-box {
      flex: 1; background: rgba(33, 36, 45, 0.85); padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border-color); backdrop-filter: blur(2px);
    }

    .hero-badge-inline { font-size: 9px; font-weight: 700; color: var(--accent-color); margin-left: 4px; }
    .hero-level { font-family: 'Press Start 2P', cursive; font-size: 10px; color: var(--accent-color); margin-bottom: 4px; }

    .exp-bar-bg { background: #1a1c23; height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid #4a4e69; position: relative; }
    .exp-bar-fill { background: linear-gradient(90deg, #f1c40f, #e67e22); height: 100%; width: 0%; transition: width 0.3s ease; }
    .exp-text { position: absolute; width: 100%; text-align: center; font-size: 8px; font-weight: 700; top: 0; line-height: 12px; color: #fff; text-shadow: 1px 1px 2px #000; }

    .icon-add-btn {
      background: var(--accent-color); color: white; border: none; width: 32px; height: 32px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.5); pointer-events: auto; flex-shrink: 0;
    }

    .quest-list-container { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .quest-list { display: flex; flex-direction: column; gap: 8px; height: 100%; overflow-y: auto; padding-right: 2px; }
    .empty-msg { text-align: center; color: #868e96; font-size: 13px; margin: auto; line-height: 1.6; }

    .quest-card {
      background: #21242d; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.3s; flex-shrink: 0; transition: opacity 0.3s;
    }
    .quest-card.completed-card { opacity: 0.6; background: #1a1c23; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .quest-main-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: 8px; }
    .quest-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .quest-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; word-break: break-all; }
    .quest-type-badge { font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: 700; flex-shrink: 0; }
    .badge-daily { background: #3498db; color: white; }
    .badge-once { background: #9b59b6; color: white; }
    .time-tag { font-size: 10px; color: #f1c40f; font-weight: 700; }
    .difficulty-tag { font-size: 10px; color: #868e96; }

    .subquest-list { display: flex; flex-direction: column; gap: 4px; background: #1a1c23; padding: 6px 10px; border-radius: 8px; border: 1px solid #3a3f51; }
    .subquest-item { font-size: 11px; color: #ccc; display: flex; align-items: center; gap: 6px; }
    .subquest-item input { cursor: pointer; accent-color: var(--accent-color); }
    .subquest-item.sub-done { text-decoration: line-through; color: #6c757d; }

    .quest-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .clear-btn { background: var(--success-color); color: white; border: none; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .fail-btn { background: var(--danger-color); color: white; border: none; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .remove-btn { background: none; border: none; color: #868e96; font-size: 14px; padding: 4px; cursor: pointer; font-weight: 700; }

    .input-page-modal, .shop-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: #f4e4bc; background-image: radial-gradient(#e3cb98 1px, transparent 1px); background-size: 16px 16px;
      z-index: 50; padding: 20px 16px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom));
      flex-direction: column; justify-content: space-between; animation: slideUp 0.3s ease-out; color: #3e2723; border: 6px solid #8d6e63;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #8d6e63; padding-bottom: 10px; }
    .modal-header h3 { font-size: 15px; font-weight: 700; color: #4e342e; }
    .close-page-btn { background: none; border: none; color: #8d6e63; font-size: 20px; cursor: pointer; font-weight: 700; }

    .submit-quest-btn { width: 100%; padding: 12px; background: #8d6e63; color: #fff8e1; border: 2px solid #4e342e; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    
    .input-form-body { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; flex: 1; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 12px; color: #5d4037; font-weight: 700; display: flex; justify-content: space-between; }
    .quest-input-full { width: 100%; padding: 9px; border-radius: 10px; border: 2px solid #a1887f; background: #fff8e1; color: #3e2723; font-size: 12px; font-weight: 700; }

    .btn-toggle-box { display: flex; gap: 6px; }
    .opt-btn { flex: 1; padding: 8px 4px; background: #efebe9; border: 2px solid #a1887f; color: #6d4c41; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; }
    .opt-btn.active-type { background: #5c6bc0; color: white; border-color: #3f51b5; }

    .diff-slider { -webkit-appearance: none; appearance: none; height: 10px; border-radius: 5px; background: #d7ccc8; border: 1px solid #8d6e63; }
    .diff-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #f39c12; cursor: pointer; border: 2px solid #4e342e; }

    .shop-item-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; overflow-y: auto; flex: 1; }
    .shop-item-card { background: #fff8e1; border: 2px solid #a1887f; border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
    .shop-item-title { font-size: 12px; font-weight: 700; color: #4e342e; }
    .shop-item-desc { font-size: 10px; color: #795548; margin-top: 2px; }
    .buy-btn { background: #2ecc71; color: white; border: 1px solid #27ae60; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 11px; cursor: pointer; }
    .buy-btn:disabled { background: #b0bec5; border-color: #90a4ae; cursor: not-allowed; }

    .level-up-modal, .stats-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box { background: var(--card-bg); border: 2px solid var(--accent-color); padding: 20px; border-radius: 20px; text-align: center; width: 100%; max-width: 320px; }
    .modal-box h2 { font-family: 'Press Start 2P', cursive; color: var(--accent-color); margin-bottom: 12px; font-size: 15px; }
    .chart-canvas-box { width: 100%; height: 130px; margin-top: 12px; background: #21242d; border-radius: 10px; border: 1px solid var(--border-color); padding: 8px; display: flex; justify-content: center; align-items: center; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-header-bar">
      <div class="today-date-text" id="todayDateView" onclick="openStatsModal()">📅 로딩 중...</div>
      <div class="header-right-tools">
        <div class="streak-badge" id="streakBadge">🔥 0일</div>
        <div class="gold-badge" id="goldBadge" onclick="openShopModal()">🪙 0G</div>
      </div>
    </div>

    <!-- Canvas 스테이지 영역 -->
    <div class="battle-stage-canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      
      <div class="hero-profile-overlay">
        <div class="hero-info-box">
          <div class="hero-level" id="heroLevel">LV. 1 <span class="hero-badge-inline" id="heroBadge">🌱 초보</span></div>
          <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="expFill"></div>
            <div class="exp-text" id="expText">0 / 100 EXP</div>
          </div>
        </div>
        <button class="icon-add-btn" id="openAddModalBtn">➕</button>
      </div>
    </div>

    <div class="quest-list-container">
      <div class="quest-list" id="questList"></div>
    </div>

    <!-- 퀘스트 등록 모달 -->
    <div class="input-page-modal" id="inputPageModal">
      <div class="modal-header">
        <h3>📜 퀘스트 수락서 작성</h3>
        <button class="close-page-btn" id="closePageBtn">✕</button>
      </div>

      <button class="submit-quest-btn" id="submitQuestBtn">⚔️ 퀘스트 수락 완료</button>

      <div class="input-form-body">
        <div class="form-group">
          <label>퀘스트 메인 목표</label>
          <input type="text" class="quest-input-full" id="questInput" placeholder="예: 아침 루틴 실행하기">
        </div>

        <div class="form-group">
          <label>하위 퀘스트 쪼개기 (쉼표 , 구분)</label>
          <input type="text" class="quest-input-full" id="subQuestInput" placeholder="예: 물 한잔, 스트레칭, 영양제">
        </div>

        <div class="form-group">
          <label>수행 알림 시간 (지정 시 알림 발송)</label>
          <input type="time" class="quest-input-full" id="questTimeInput">
        </div>

        <div class="form-group">
          <label>퀘스트 유형</label>
          <div class="btn-toggle-box">
            <div class="opt-btn active-type" id="typeDailyBtn" onclick="selectType('daily')">🔄 일일 (매일 반복)</div>
            <div class="opt-btn" id="typeOnceBtn" onclick="selectType('once')">📜 일반 (1회성)</div>
          </div>
        </div>

        <div class="form-group" id="dateGroup" style="display: none;">
          <label>목표 날짜 지정</label>
          <input type="date" class="quest-input-full" id="questDateInput">
        </div>

        <div class="form-group">
          <label>
            <span>난이도 게이지 (10~50)</span>
            <span id="diffLabelText" style="color: #d35400;">보통 (+20 EXP)</span>
          </label>
          <input type="range" min="10" max="50" step="5" value="20" class="diff-slider" id="diffRangeInput" oninput="onDiffSliderChange(this.value)">
        </div>
      </div>
    </div>

    <!-- 모험가 상점 모달 -->
    <div class="shop-modal" id="shopModal">
      <div class="modal-header">
        <h3>🪙 모험가 상점</h3>
        <button class="close-page-btn" onclick="closeShopModal()">✕</button>
      </div>

      <div class="shop-item-list">
        <div class="shop-item-card">
          <div>
            <div class="shop-item-title">🛡️ 스트릭 수호권</div>
            <div class="shop-item-desc">퀘스트 미이행 시 연속 스트릭 파괴를 1회 막아줍니다. (보유: <span id="shieldCount">0</span>개)</div>
          </div>
          <button class="buy-btn" onclick="buyItem('shield', 100)">100G</button>
        </div>

        <div class="shop-item-card">
          <div>
            <div class="shop-item-title">🧪 EXP 2배 포션 (24h)</div>
            <div class="shop-item-desc">24시간 동안 모든 퀘스트 완료 EXP가 2배 상승합니다.</div>
          </div>
          <button class="buy-btn" onclick="buyItem('doubleExp', 150)">150G</button>
        </div>

        <div class="shop-item-card">
          <div>
            <div class="shop-item-title">👑 골드 모험가 칭호</div>
            <div class="shop-item-desc">프로필 배지를 전설적인 [황금 모험가]로 교체합니다.</div>
          </div>
          <button class="buy-btn" onclick="buyItem('goldTitle', 300)">300G</button>
        </div>
      </div>
    </div>
  </div>

  <div class="level-up-modal" id="levelUpModal">
    <div class="modal-box">
      <h2>LEVEL UP!</h2>
      <p id="levelUpMsg">레벨이 상승했습니다! 🎉</p>
      <button onclick="document.getElementById('levelUpModal').style.display='none'">확인 완료</button>
    </div>
  </div>

  <div class="stats-modal" id="statsModal">
    <div class="modal-box">
      <h2>📊 EXP SCORE</h2>
      <p style="font-size: 11px; color: #868e96;">최근 일주일간 획득한 EXP 누적 그래프</p>
      <div class="chart-canvas-box"><canvas id="scoreChartCanvas"></canvas></div>
      <button onclick="closeStatsModal()" style="margin-top:10px; width:100%; padding:8px;">확인 완료</button>
    </div>
  </div>

  <script>
    let level = parseInt(localStorage.getItem('quest_level')) || 1;
    let currentExp = parseInt(localStorage.getItem('quest_exp')) || 0;
    let gold = parseInt(localStorage.getItem('quest_gold')) || 0;
    let streakDays = parseInt(localStorage.getItem('quest_streak')) || 0;
    let shieldCount = parseInt(localStorage.getItem('quest_shield')) || 0;
    let doubleExpUntil = parseInt(localStorage.getItem('quest_double_exp_until')) || 0;
    let hasGoldTitle = localStorage.getItem('quest_gold_title') === 'true';
    let lastResetDate = localStorage.getItem('quest_last_reset') || '';

    let dailyExpScores = JSON.parse(localStorage.getItem('quest_daily_exp_scores')) || {};
    let quests = JSON.parse(localStorage.getItem('quest_list_v3')) || [];

    let selectedType = 'daily';
    let selectedDiff = 20;
    let isBattleProcessing = false;

    /* ==========================================
       CANVAS RPG ENGINE (기존 핵심 그래픽 엔진 유지)
       ========================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width; canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);

    let bgScrollX = 0;
    let isScrolling = true;

    const hero = { x: 40, y: 0, width: 32, height: 42, walkFrame: 0, animTimer: 0, state: 'WALK', visible: true, blinkTimer: 0, rotation: 0 };
    const monster = { x: 9999, y: 0, width: 40, height: 40, type: 'SLIME', visible: false, blinkTimer: 0 };
    let blueFlames = []; let particles = []; let damageNumbers = [];

    const bgTrees = Array.from({ length: 5 }, (_, idx) => ({ x: idx * 120 + Math.random() * 50, type: Math.random() > 0.5 ? 'TALL' : 'SHORT' }));

    function spawnParticles(x, y, color, count = 20) {
      for (let i = 0; i < count; i++) {
        particles.push({ x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6, size: Math.random() * 3 + 2, color, alpha: 1, life: 0.05 });
      }
    }

    function spawnDamageNumber(x, y, text, color) {
      damageNumbers.push({ x, y, text, color, alpha: 1, scale: 1.5 });
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      if (isScrolling) bgScrollX += 60 * dt;

      hero.animTimer += dt;
      if (hero.animTimer > 0.12) {
        hero.walkFrame = (hero.walkFrame + 1) % 4;
        hero.animTimer = 0;
      }

      const groundY = canvas.height - 35;
      hero.y = groundY - hero.height + (isScrolling ? Math.sin(bgScrollX * 0.18) * 3 : 0);

      if (monster.visible) {
        monster.x = canvas.width - 70;
        monster.y = groundY - monster.height;
      }

      blueFlames.forEach((bf, idx) => {
        bf.x += 380 * dt;
        if (bf.x >= monster.x) {
          spawnParticles(bf.x, bf.y, '#00f0ff', 15);
          monster.blinkTimer = 0.2;
          spawnDamageNumber(monster.x, monster.y - 10, `-${bf.damage}`, '#00f0ff');
          blueFlames.splice(idx, 1);
        }
      });

      particles.forEach((p, idx) => { p.x += p.vx; p.y += p.vy; p.alpha -= p.life; if (p.alpha <= 0) particles.splice(idx, 1); });
      damageNumbers.forEach((d, idx) => { d.y -= 20 * dt; d.alpha -= 0.8 * dt; if (d.alpha <= 0) damageNumbers.splice(idx, 1); });

      drawGame();
      requestAnimationFrame(gameLoop);
    }

    function drawGame() {
      if (!canvas.width) return;
      const groundY = canvas.height - 35;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#111e38'; ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 디테일 잔디 및 도트
      ctx.fillStyle = '#1f2d3d'; ctx.fillRect(0, groundY, canvas.width, 35);
      ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, groundY, canvas.width, 3);
      for (let i = -1; i < canvas.width / 12 + 1; i++) {
        const gx = (i * 12) - ((bgScrollX) % 12);
        ctx.fillRect(gx, groundY - 3, 3, 3);
      }

      // 영웅 그리기
      if (hero.visible) {
        ctx.fillStyle = hasGoldTitle ? '#ffd700' : '#f39c12';
        ctx.fillRect(hero.x + 8, hero.y + 10, 16, 20);
        ctx.fillStyle = '#ffcc99'; ctx.fillRect(hero.x + 10, hero.y + 4, 12, 10);
      }

      // 몬스터 그리기
      if (monster.visible) {
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(monster.x, monster.y + 10, 30, 25);
      }

      blueFlames.forEach(bf => { ctx.fillStyle = '#00f0ff'; ctx.beginPath(); ctx.arc(bf.x, bf.y, 6, 0, Math.PI * 2); ctx.fill(); });
      particles.forEach(p => { ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore(); });
      damageNumbers.forEach(d => { ctx.save(); ctx.globalAlpha = d.alpha; ctx.font = '700 14px "Press Start 2P"'; ctx.fillStyle = d.color; ctx.fillText(d.text, d.x, d.y); ctx.restore(); });
    }

    /* ==========================================
       추천 요소 4가지 기능 로직 구현
       ========================================== */
    function getKSTDateString(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' }).format(d);
    }

    function checkStreakAndReset() {
      const todayKST = getKSTDateString();
      if (lastResetDate !== todayKST && lastResetDate !== '') {
        const yesterdayKST = getKSTDateString(-1);
        
        // 어제 퀘스트 수행 여부 체크
        const wasYesterdayActive = dailyExpScores[yesterdayKST] > 0;
        
        if (!wasYesterdayActive) {
          if (shieldCount > 0) {
            shieldCount--;
            alert("🛡️ 스트릭 수호권이 자동 사용되어 연속 달성일이 보존되었습니다!");
          } else {
            streakDays = 0; // 스트릭 파괴
          }
        }

        lastResetDate = todayKST;
        saveData();
      } else if (lastResetDate === '') {
        lastResetDate = todayKST;
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('quest_level', level);
      localStorage.setItem('quest_exp', currentExp);
      localStorage.setItem('quest_gold', gold);
      localStorage.setItem('quest_streak', streakDays);
      localStorage.setItem('quest_shield', shieldCount);
      localStorage.setItem('quest_double_exp_until', doubleExpUntil);
      localStorage.setItem('quest_gold_title', hasGoldTitle);
      localStorage.setItem('quest_last_reset', lastResetDate);
      localStorage.setItem('quest_daily_exp_scores', JSON.stringify(dailyExpScores));
      localStorage.setItem('quest_list_v3', JSON.stringify(quests));
      updateUI();
    }

    function updateUI() {
      document.getElementById('goldBadge').textContent = `🪙 ${gold}G`;
      document.getElementById('streakBadge').textContent = `🔥 ${streakDays}일`;
      document.getElementById('shieldCount').textContent = shieldCount;

      const maxExp = level * 100;
      const title = hasGoldTitle ? '👑 황금 모험가' : (level >= 10 ? '⚔️ 숙련 모험가' : '🌱 초보 모험가');
      document.getElementById('heroLevel').innerHTML = `LV. ${level} <span class="hero-badge-inline">${title}</span>`;
      document.getElementById('expFill').style.width = `${Math.min((currentExp / maxExp) * 100, 100)}%`;
      document.getElementById('expText').textContent = `${currentExp} / ${maxExp} EXP`;
    }

    function renderQuests() {
      const listEl = document.getElementById('questList');
      listEl.innerHTML = '';
      const todayKST = getKSTDateString();

      const visibleQuests = quests.map((q, idx) => ({ ...q, originalIndex: idx }))
        .filter(q => q.type === 'daily' || (q.type === 'once' && q.targetDate === todayKST));

      if (visibleQuests.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">📜 오늘 수행할 퀘스트가 없습니다.<br>상단 + 버튼을 눌러 목표를 추가하세요!</div>';
        return;
      }

      visibleQuests.forEach(q => {
        const idx = q.originalIndex;
        const isDone = q.completed || q.failed;
        const card = document.createElement('div');
        card.className = `quest-card ${isDone ? 'completed-card' : ''}`;

        let subHtml = '';
        if (q.subQuests && q.subQuests.length > 0) {
          subHtml = `<div class="subquest-list">` + 
            q.subQuests.map((sq, sIdx) => `
              <div class="subquest-item ${sq.done ? 'sub-done' : ''}">
                <input type="checkbox" ${sq.done ? 'checked' : ''} ${isDone ? 'disabled' : ''} onchange="toggleSubQuest(${idx}, ${sIdx})">
                <span>${sq.text}</span>
              </div>
            `).join('') + `</div>`;
        }

        card.innerHTML = `
          <div class="quest-main-row">
            <div class="quest-info">
              <div class="quest-title">
                <span class="quest-type-badge ${q.type==='daily'?'badge-daily':'badge-once'}">${q.type==='daily'?'일일':'일반'}</span>
                ${q.text}
              </div>
              <div>
                ${q.time ? `<span class="time-tag">⏰ ${q.time}</span> ` : ''}
                <span class="difficulty-tag">보상: +${q.exp} EXP / +${Math.floor(q.exp/2)}G</span>
              </div>
            </div>
            <div class="quest-actions">
              <button class="clear-btn" ${isDone?'disabled':''} onclick="clearQuest(${idx})">완료</button>
              <button class="fail-btn" ${isDone?'disabled':''} onclick="failQuest(${idx})">실패</button>
              <button class="remove-btn" onclick="removeQuest(${idx})">✕</button>
            </div>
          </div>
          ${subHtml}
        `;
        listEl.appendChild(card);
      });
    }

    function toggleSubQuest(qIdx, sIdx) {
      quests[qIdx].subQuests[sIdx].done = !quests[qIdx].subQuests[sIdx].done;
      saveData();
      renderQuests();
    }

    function clearQuest(index) {
      if (isBattleProcessing) return;
      isBattleProcessing = true;
      const q = quests[index];

      monster.visible = true;
      blueFlames.push({ x: hero.x + 30, y: hero.y + 15, damage: q.exp });

      setTimeout(() => {
        monster.visible = false;
        q.completed = true;

        // EXP 2배 버프 체크
        const expMult = Date.now() < doubleExpUntil ? 2 : 1;
        const finalExp = q.exp * expMult;
        const earnedGold = Math.floor(q.exp / 2);

        currentExp += finalExp;
        gold += earnedGold;

        // 오늘 첫 클리어 시 스트릭 증가
        const todayKST = getKSTDateString();
        if (!dailyExpScores[todayKST] || dailyExpScores[todayKST] === 0) {
          streakDays++;
        }
        dailyExpScores[todayKST] = (dailyExpScores[todayKST] || 0) + finalExp;

        // 레벨업 체크
        if (currentExp >= level * 100) {
          currentExp -= level * 100;
          level++;
          document.getElementById('levelUpModal').style.display = 'flex';
        }

        saveData();
        renderQuests();
        isBattleProcessing = false;
      }, 600);
    }

    function failQuest(index) {
      const q = quests[index];
      q.failed = true;
      currentExp = Math.max(0, currentExp - q.exp);
      saveData();
      renderQuests();
    }

    function removeQuest(index) {
      quests.splice(index, 1);
      saveData();
      renderQuests();
    }

    // 상점 시스템
    function openShopModal() { document.getElementById('shopModal').style.display = 'flex'; }
    function closeShopModal() { document.getElementById('shopModal').style.display = 'none'; }

    function buyItem(itemType, cost) {
      if (gold < cost) { alert("골드가 부족합니다!"); return; }
      gold -= cost;

      if (itemType === 'shield') shieldCount++;
      if (itemType === 'doubleExp') doubleExpUntil = Date.now() + (24 * 60 * 60 * 1000);
      if (itemType === 'goldTitle') hasGoldTitle = true;

      saveData();
      alert("아이템을 성공적으로 구매했습니다!");
    }

    // 등록 폼 처리
    document.getElementById('openAddModalBtn').onclick = () => document.getElementById('inputPageModal').style.display = 'flex';
    document.getElementById('closePageBtn').onclick = () => document.getElementById('inputPageModal').style.display = 'none';

    function selectType(type) {
      selectedType = type;
      document.getElementById('typeDailyBtn').classList.toggle('active-type', type === 'daily');
      document.getElementById('typeOnceBtn').classList.toggle('active-type', type === 'once');
      document.getElementById('dateGroup').style.display = type === 'once' ? 'flex' : 'none';
    }

    function onDiffSliderChange(val) {
      selectedDiff = parseInt(val);
      document.getElementById('diffLabelText').textContent = `+${selectedDiff} EXP`;
    }

    document.getElementById('submitQuestBtn').onclick = () => {
      const text = document.getElementById('questInput').value.trim();
      if (!text) return;

      const subText = document.getElementById('subQuestInput').value.trim();
      const subQuests = subText ? subText.split(',').map(s => ({ text: s.trim(), done: false })) : [];
      const timeVal = document.getElementById('questTimeInput').value;

      quests.push({
        text,
        subQuests,
        time: timeVal,
        type: selectedType,
        exp: selectedDiff,
        targetDate: selectedType === 'once' ? document.getElementById('questDateInput').value : null,
        completed: false,
        failed: false
      });

      saveData();
      renderQuests();
      document.getElementById('questInput').value = '';
      document.getElementById('subQuestInput').value = '';
      document.getElementById('inputPageModal').style.display = 'none';
    };

    // 알림 및 특정 시각 타이머 체크
    function checkTimeNotifications() {
      const now = new Date();
      const currentTimeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      
      quests.forEach(q => {
        if (!q.completed && !q.failed && q.time === currentTimeStr && !q.notifiedToday) {
          if ('Notification' in window && Notification.permission === 'granted') {
            new Notification(`⚔️ [LifeQuest] 루틴 실행 시간!`, { body: `'${q.text}' 수행 시간입니다. 바로 클리어해 보세요!` });
          }
          q.notifiedToday = true;
        }
      });
    }

    function openStatsModal() { document.getElementById('statsModal').style.display = 'flex'; }
    function closeStatsModal() { document.getElementById('statsModal').style.display = 'none'; }

    resizeCanvas();
    requestAnimationFrame(gameLoop);
    checkStreakAndReset();
    saveData();
    renderQuests();
    setInterval(checkTimeNotifications, 30000);
  </script>
</body>
</html>
