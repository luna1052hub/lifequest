<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIFE QUEST - RPG Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #2d313e;
      --accent-color: #f39c12;
      --success-color: #2ecc71;
      --text-color: #ffffff;
      --border-color: #4a4e69;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .game-container {
      background: var(--card-bg); width: 100%; max-width: 420px; min-height: 620px; border-radius: 20px; padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; justify-content: space-between; position: relative; overflow: hidden;
    }

    /* 캐릭터 프로필 & 전투 스테이지 */
    .battle-stage {
      background: #21242d; border-radius: 14px; padding: 14px; border: 1px solid var(--border-color); position: relative; min-height: 110px; display: flex; align-items: center; overflow: hidden;
    }

    .hero-profile { display: flex; align-items: center; gap: 14px; width: 100%; }
    .hero-avatar { font-size: 40px; background: #3a3f51; padding: 6px; border-radius: 12px; }
    .hero-info { flex: 1; }
    .hero-level { font-family: 'Press Start 2P', cursive; font-size: 12px; color: var(--accent-color); margin-bottom: 6px; }
    .exp-bar-bg { background: #1a1c23; height: 16px; border-radius: 8px; overflow: hidden; border: 1px solid #4a4e69; position: relative; }
    .exp-bar-fill { background: linear-gradient(90deg, #f1c40f, #e67e22); height: 100%; width: 0%; transition: width 0.3s ease; }
    .exp-text { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 700; top: 0; line-height: 16px; color: #fff; text-shadow: 1px 1px 2px #000; }

    /* 다이나믹 전투 레이어 */
    .battle-arena {
      display: none; width: 100%; justify-content: space-between; align-items: center; padding: 0 15px; position: relative; height: 100%;
    }
    .fighter { font-size: 42px; transition: transform 0.15s ease-out; position: relative; z-index: 2; }
    .vs-text { font-family: 'Press Start 2P', cursive; font-size: 14px; color: #e74c3c; animation: pulse 0.4s infinite alternate; z-index: 2; }
    @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.3); } }

    /* 타격 이펙트 & 데미지 텍스트 */
    .hit-effect {
      position: absolute; right: 20px; font-size: 48px; opacity: 0; z-index: 10; pointer-events: none;
    }
    .damage-text {
      position: absolute; right: 10px; top: -10px; font-family: 'Press Start 2P', cursive; font-size: 13px; color: #ff0055; text-shadow: 2px 2px #000; opacity: 0; z-index: 10; font-weight: 700;
    }

    /* 전투 애니메이션 클래스 */
    .stage-shake { animation: shake 0.3s ease-in-out; }
    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-8px, 4px); }
      40% { transform: translate(8px, -4px); }
      60% { transform: translate(-6px, -2px); }
      80% { transform: translate(6px, 2px); }
    }

    .hero-dash { transform: translateX(80px) scale(1.3) rotate(15deg) !important; }
    .monster-hit { animation: flashRed 0.15s 2; }
    @keyframes flashRed { 0%, 100% { opacity: 1; filter: none; } 50% { opacity: 0.2; filter: drop-shadow(0 0 15px #e74c3c) sepia(100%) hue-rotate(-50deg) saturate(600%); } }

    .hit-active { animation: popHit 0.4s ease-out forwards; }
    @keyframes popHit { 0% { opacity: 0; transform: scale(0.3) rotate(-20deg); } 50% { opacity: 1; transform: scale(1.5) rotate(10deg); } 100% { opacity: 0; transform: scale(1); } }

    .damage-active { animation: floatUp 0.6s ease-out forwards; }
    @keyframes floatUp { 0% { opacity: 0; transform: translateY(10px); } 30% { opacity: 1; transform: translateY(-10px) scale(1.2); } 100% { opacity: 0; transform: translateY(-30px); } }

    .monster-die { transform: translateY(40px) rotate(180deg) scale(0) !important; opacity: 0; transition: all 0.4s ease-in; }

    /* 퀘스트 목록 */
    .quest-list-container { flex: 1; display: flex; flex-direction: column; }
    .quest-list { display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; }
    .empty-msg { text-align: center; color: #868e96; font-size: 13px; margin: auto; line-height: 1.6; }

    .quest-card {
      background: #21242d; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .quest-info { display: flex; flex-direction: column; gap: 4px; }
    .quest-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; word-break: break-all; }
    .quest-type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .badge-daily { background: #3498db; color: white; }
    .badge-once { background: #9b59b6; color: white; }
    .difficulty-tag { font-size: 10px; color: #868e96; }

    .quest-actions { display: flex; gap: 6px; align-items: center; }
    .clear-btn {
      background: var(--success-color); color: white; border: none; padding: 8px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .clear-btn:disabled { background: #4a4e69; cursor: not-allowed; opacity: 0.6; }
    .delete-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 14px; padding: 4px; }

    /* 메인 하단 버튼 */
    .open-add-modal-btn {
      width: 100%; padding: 14px; background: var(--accent-color); color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(243, 156, 18, 0.3); transition: transform 0.1s;
    }
    .open-add-modal-btn:active { transform: scale(0.98); }

    /* 양피지 스타일 퀘스트 수락 모달 페이지 */
    .input-page-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: #f4e4bc;
      background-image: radial-gradient(#e3cb98 1px, transparent 1px);
      background-size: 16px 16px;
      z-index: 50; padding: 24px 20px; flex-direction: column; justify-content: space-between; 
      animation: slideUp 0.3s ease-out; color: #3e2723; border: 6px solid #8d6e63; border-radius: 16px;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #8d6e63; padding-bottom: 12px; }
    .modal-header h3 { font-size: 16px; font-weight: 700; color: #4e342e; }
    .close-page-btn { background: none; border: none; color: #8d6e63; font-size: 22px; cursor: pointer; font-weight: 700; }

    /* 완료 버튼 상단 배치 */
    .submit-quest-btn {
      width: 100%; padding: 14px; background: #8d6e63; color: #fff8e1; border: 2px solid #4e342e; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .submit-quest-btn:active { transform: scale(0.98); background: #6d4c41; }

    .input-form-body { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; flex: 1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: #5d4037; font-weight: 700; }
    .quest-input-full { 
      width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #a1887f; background: #fff8e1; color: #3e2723; font-size: 14px; font-weight: 700;
    }

    .btn-toggle-box { display: flex; gap: 8px; }
    .opt-btn {
      flex: 1; padding: 10px 6px; background: #efebe9; border: 2px solid #a1887f; color: #6d4c41; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .opt-btn.active-type { background: #5c6bc0; color: white; border-color: #3f51b5; }
    .opt-btn-easy.active-diff { background: #4caf50; color: white; border-color: #2e7d32; }
    .opt-btn-medium.active-diff { background: #ffb300; color: #3e2723; border-color: #ff8f00; }
    .opt-btn-hard.active-diff { background: #e53935; color: white; border-color: #c62828; }

    /* 레벨업 팝업 */
    .level-up-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 2px solid var(--accent-color); padding: 24px; border-radius: 20px; text-align: center; animation: pop 0.3s ease-out; width: 100%; max-width: 320px;
    }
    @keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }
    .modal-box h2 { font-family: 'Press Start 2P', cursive; color: var(--accent-color); margin-bottom: 14px; font-size: 18px; }
    .modal-box p { font-size: 13px; line-height: 1.5; color: #fff; }
    .modal-box button { margin-top: 16px; width: 100%; padding: 10px; background: var(--accent-color); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 캐릭터 프로필 및 전투 스테이지 -->
    <div class="battle-stage" id="battleStage">
      <!-- 1) 캐릭터 프로필 -->
      <div class="hero-profile" id="heroProfileView">
        <div class="hero-avatar" id="heroAvatar">⚔️</div>
        <div class="hero-info">
          <div class="hero-level" id="heroLevel">LV. 1 용사</div>
          <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="expFill"></div>
            <div class="exp-text" id="expText">0 / 100 EXP</div>
          </div>
        </div>
      </div>

      <!-- 2) 다이나믹 액션 전투 무대 -->
      <div class="battle-arena" id="battleArenaView">
        <div class="fighter" id="heroFighter">⚔️</div>
        <div class="vs-text" id="vsText">VS</div>
        <div class="fighter" id="monsterFighter">👾</div>
        <div class="hit-effect" id="hitEffect">💥</div>
        <div class="damage-text" id="damageText">CRITICAL!</div>
      </div>
    </div>

    <!-- 퀘스트 리스트 영역 -->
    <div class="quest-list-container">
      <div class="quest-list" id="questList"></div>
    </div>

    <!-- 메인 하단 퀘스트 수락 페이지 이동 버튼 -->
    <button class="open-add-modal-btn" id="openAddModalBtn">➕ 새로운 퀘스트 수락하기</button>

    <!-- 양피지 스타일 퀘스트 입력 모달 -->
    <div class="input-page-modal" id="inputPageModal">
      <div class="modal-header">
        <h3>📜 퀘스트 수락서 작성</h3>
        <button class="close-page-btn" id="closePageBtn">✕</button>
      </div>

      <!-- 1. 완료 버튼을 맨 위에 배치 -->
      <button class="submit-quest-btn" id="submitQuestBtn">⚔️ 퀘스트 수락 완료</button>

      <!-- 2. 입력 양식 -->
      <div class="input-form-body">
        <div class="form-group">
          <label>퀘스트 목표</label>
          <input type="text" class="quest-input-full" id="questInput" placeholder="예: 매일 운동 30분 하기">
        </div>

        <div class="form-group">
          <label>퀘스트 유형</label>
          <div class="btn-toggle-box">
            <div class="opt-btn active-type" id="typeDailyBtn" onclick="selectType('daily')">🔄 일일 (매일 반복)</div>
            <div class="opt-btn" id="typeOnceBtn" onclick="selectType('once')">📜 일반 (1회성)</div>
          </div>
        </div>

        <div class="form-group">
          <label>난이도 설정</label>
          <div class="btn-toggle-box">
            <div class="opt-btn opt-btn-easy" id="diff10Btn" onclick="selectDiff(10)">🟢 쉬움 (+10 EXP)</div>
            <div class="opt-btn opt-btn-medium active-diff" id="diff20Btn" onclick="selectDiff(20)">🟡 보통 (+20 EXP)</div>
            <div class="opt-btn opt-btn-hard" id="diff40Btn" onclick="selectDiff(40)">🔴 어려움 (+40 EXP)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 레벨업 모달 -->
  <div class="level-up-modal" id="levelUpModal">
    <div class="modal-box">
      <h2>LEVEL UP!</h2>
      <p id="levelUpMsg">레벨이 상승했습니다! 🎉</p>
      <button id="closeModal">성장 완료!</button>
    </div>
  </div>

  <script>
    let level = parseInt(localStorage.getItem('quest_level')) || 1;
    let currentExp = parseInt(localStorage.getItem('quest_exp')) || 0;
    let lastResetDate = localStorage.getItem('quest_last_reset') || '';

    let selectedType = 'daily';
    let selectedDiff = 20;

    const avatars = ['⚔️', '🛡️', '🧙‍♂️', '🥷', '👑', '🐉'];
    const monsters = ['👾', '👹', '💀', '🗿', '🐉', '👻'];
    let quests = JSON.parse(localStorage.getItem('quest_list_v2')) || [];

    function getMaxExp() {
      return level * 100;
    }

    function checkDailyReset() {
      const today = new Date().toDateString();
      if (lastResetDate !== today) {
        quests.forEach(q => {
          if (q.type === 'daily') q.completed = false;
        });
        lastResetDate = today;
        localStorage.setItem('quest_last_reset', lastResetDate);
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('quest_level', level);
      localStorage.setItem('quest_exp', currentExp);
      localStorage.setItem('quest_list_v2', JSON.stringify(quests));
    }

    function updateProfile() {
      const maxExp = getMaxExp();
      document.getElementById('heroLevel').textContent = `LV. ${level} 용사`;
      document.getElementById('heroAvatar').textContent = avatars[(level - 1) % avatars.length];
      
      const expPercent = Math.min((currentExp / maxExp) * 100, 100);
      document.getElementById('expFill').style.width = `${expPercent}%`;
      document.getElementById('expText').textContent = `${currentExp} / ${maxExp} EXP`;
    }

    document.getElementById('openAddModalBtn').addEventListener('click', () => {
      document.getElementById('inputPageModal').style.display = 'flex';
    });

    document.getElementById('closePageBtn').addEventListener('click', () => {
      document.getElementById('inputPageModal').style.display = 'none';
    });

    function selectType(type) {
      selectedType = type;
      document.getElementById('typeDailyBtn').classList.remove('active-type');
      document.getElementById('typeOnceBtn').classList.remove('active-type');
      if (type === 'daily') document.getElementById('typeDailyBtn').classList.add('active-type');
      else document.getElementById('typeOnceBtn').classList.add('active-type');
    }

    function selectDiff(exp) {
      selectedDiff = exp;
      document.getElementById('diff10Btn').classList.remove('active-diff');
      document.getElementById('diff20Btn').classList.remove('active-diff');
      document.getElementById('diff40Btn').classList.remove('active-diff');

      if (exp === 10) document.getElementById('diff10Btn').classList.add('active-diff');
      if (exp === 20) document.getElementById('diff20Btn').classList.add('active-diff');
      if (exp === 40) document.getElementById('diff40Btn').classList.add('active-diff');
    }

    function renderQuests() {
      const listEl = document.getElementById('questList');
      listEl.innerHTML = '';

      if (quests.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">📜 수락한 퀘스트가 없습니다.<br>아래 버튼을 눌러 퀘스트를 수락해 보세요!</div>';
        return;
      }

      quests.forEach((q, index) => {
        const card = document.createElement('div');
        card.className = 'quest-card';
        
        const typeBadge = q.type === 'daily' 
          ? '<span class="quest-type-badge badge-daily">일일</span>' 
          : '<span class="quest-type-badge badge-once">일반</span>';

        const diffText = q.exp === 10 ? '쉬움 (+10)' : (q.exp === 40 ? '어려움 (+40)' : '보통 (+20)');

        card.innerHTML = `
          <div class="quest-info">
            <div class="quest-title">${typeBadge} ${q.text}</div>
            <div class="difficulty-tag">난이도: ${diffText}</div>
          </div>
          <div class="quest-actions">
            <button class="clear-btn" ${q.completed ? 'disabled' : ''} onclick="clearQuestWithBattle(${index})">
              ${q.completed ? '완료됨 ✔' : '클리어'}
            </button>
            <button class="delete-btn" onclick="deleteQuest(${index})">✕</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    /* 난이도별 타격 시간(쉬움:2초, 보통:3초, 어려움:4초) 반영 액션 연출 */
    function clearQuestWithBattle(index) {
      const q = quests[index];
      if (q.completed) return;

      const battleStage = document.getElementById('battleStage');
      const profileView = document.getElementById('heroProfileView');
      const arenaView = document.getElementById('battleArenaView');
      const heroFighter = document.getElementById('heroFighter');
      const monsterFighter = document.getElementById('monsterFighter');
      const vsText = document.getElementById('vsText');
      const hitEffect = document.getElementById('hitEffect');
      const damageText = document.getElementById('damageText');

      let battleDuration = 3000;
      if (q.exp === 10) battleDuration = 2000;
      if (q.exp === 20) battleDuration = 3000;
      if (q.exp === 40) battleDuration = 4000;

      profileView.style.display = 'none';
      arenaView.style.display = 'flex';
      
      heroFighter.textContent = avatars[(level - 1) % avatars.length];
      monsterFighter.textContent = monsters[Math.floor(Math.random() * monsters.length)];
      
      heroFighter.className = 'fighter';
      monsterFighter.className = 'fighter';
      hitEffect.className = 'hit-effect';
      damageText.className = 'damage-text';
      vsText.textContent = 'VS';
      vsText.style.color = '#e74c3c';

      const triggerHit = (dmg) => {
        heroFighter.classList.add('hero-dash');
        setTimeout(() => {
          battleStage.classList.add('stage-shake');
          monsterFighter.classList.add('monster-hit');
          
          hitEffect.classList.remove('hit-active');
          damageText.classList.remove('damage-active');
          void hitEffect.offsetWidth;
          
          hitEffect.classList.add('hit-active');
          damageText.classList.add('damage-active');
          damageText.textContent = `${dmg}!`;

          setTimeout(() => {
            heroFighter.classList.remove('hero-dash');
            battleStage.classList.remove('stage-shake');
            monsterFighter.classList.remove('monster-hit');
          }, 200);
        }, 150);
      };

      triggerHit(1000);

      let hitInterval = setInterval(() => {
        const randomDmg = Math.floor(Math.random() * 3000) + 2000;
        triggerHit(randomDmg);
      }, 750);

      setTimeout(() => {
        clearInterval(hitInterval);

        monsterFighter.classList.add('monster-die');
        vsText.textContent = 'VICTORY!';
        vsText.style.color = '#2ecc71';

        setTimeout(() => {
          arenaView.style.display = 'none';
          profileView.style.display = 'flex';

          q.completed = true;
          gainExp(q.exp);

          if (q.type === 'once') {
            quests.splice(index, 1);
          }

          saveData();
          renderQuests();
        }, 800);
      }, battleDuration);
    }

    function gainExp(amount) {
      currentExp += amount;
      const maxExp = getMaxExp();
      
      if (currentExp >= maxExp) {
        currentExp -= maxExp;
        level++;
        showLevelUpModal();
      }
      saveData();
      updateProfile();
    }

    function showLevelUpModal() {
      document.getElementById('levelUpMsg').textContent = `축하합니다! LV. ${level} 용사로 성장했습니다!\n다음 레벨 필요 경험치: ${getMaxExp()} EXP`;
      document.getElementById('levelUpModal').style.display = 'flex';
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('levelUpModal').style.display = 'none';
    });

    function deleteQuest(index) {
      quests.splice(index, 1);
      saveData();
      renderQuests();
    }

    document.getElementById('submitQuestBtn').addEventListener('click', () => {
      const input = document.getElementById('questInput');
      const text = input.value.trim();
      if (!text) return;

      quests.push({
        text: text,
        type: selectedType,
        exp: selectedDiff,
        completed: false
      });

      saveData();
      renderQuests();
      input.value = '';
      document.getElementById('inputPageModal').style.display = 'none';
    });

    checkDailyReset();
    updateProfile();
    renderQuests();
  </script>
</body>
</html>
