<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LIFE QUEST - RPG Todo</title>
  
  <meta name="theme-color" content="#1a1c23">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <link rel="icon" type="image/png" sizes="192x192" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="apple-touch-icon-precomposed" href="icon.png">

  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #2d313e;
      --accent-color: #f39c12;
      --success-color: #2ecc71;
      --danger-color: #e74c3c;
      --text-color: #ffffff;
      --border-color: #4a4e69;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg-color) !important;
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    .game-container {
      background: var(--card-bg);
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      padding: 12px;
      padding-top: max(20px, env(safe-area-inset-top));
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      box-shadow: none;
      border: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .top-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #21242d;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 11px;
      font-weight: 700;
    }

    .today-date-text {
      color: #f39c12;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .notification-btn {
      background: #3a3f51;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      cursor: pointer;
    }
    .notification-btn:active { transform: scale(0.95); }

    /* Canvas 게임 스테이지 */
    .battle-stage-canvas-wrapper {
      background: #000;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      position: relative;
      width: 100%;
      height: 160px;
      overflow: hidden;
      flex-shrink: 0;
    }

    canvas#gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .hero-profile-overlay {
      position: absolute;
      top: 6px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
      z-index: 5;
    }

    .hero-info-box {
      flex: 1;
      background: rgba(33, 36, 45, 0.85);
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      backdrop-filter: blur(2px);
    }

    .hero-badge-inline {
      font-size: 9px;
      font-weight: 700;
      color: var(--accent-color);
      margin-left: 4px;
    }

    .hero-level {
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .exp-bar-bg {
      background: #1a1c23;
      height: 12px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #4a4e69;
      position: relative;
    }

    .exp-bar-fill {
      background: linear-gradient(90deg, #f1c40f, #e67e22);
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }

    .exp-text {
      position: absolute;
      width: 100%;
      text-align: center;
      font-size: 8px;
      font-weight: 700;
      top: 0;
      line-height: 12px;
      color: #fff;
      text-shadow: 1px 1px 2px #000;
    }

    .icon-add-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
      pointer-events: auto;
      flex-shrink: 0;
    }
    .icon-add-btn:active { transform: scale(0.9); }

    .quest-list-container { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .quest-list { display: flex; flex-direction: column; gap: 8px; height: 100%; overflow-y: auto; padding-right: 2px; }
    .empty-msg { text-align: center; color: #868e96; font-size: 13px; margin: auto; line-height: 1.6; }

    .quest-card {
      background: #21242d; border: 1px solid var(--border-color); border-radius: 12px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s; flex-shrink: 0; gap: 8px;
      transition: opacity 0.3s, transform 0.3s;
    }
    .quest-card.completed-card { opacity: 0.6; background: #1a1c23; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .quest-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
    .quest-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; word-break: break-all; }
    .quest-type-badge { font-size: 9px; padding: 2px 5px; border-radius: 4px; font-weight: 700; flex-shrink: 0; }
    .badge-daily { background: #3498db; color: white; }
    .badge-once { background: #9b59b6; color: white; }
    .difficulty-tag { font-size: 10px; color: #868e96; }

    .quest-actions { display: flex; gap: 4px; align-items: center; flex-shrink: 0; }
    .clear-btn { background: var(--success-color); color: white; border: none; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .fail-btn { background: var(--danger-color); color: white; border: none; padding: 6px 8px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .remove-btn { background: none; border: none; color: #868e96; font-size: 14px; padding: 4px; cursor: pointer; font-weight: 700; margin-left: 2px; }
    .clear-btn:disabled, .fail-btn:disabled, .remove-btn:disabled { background: #4a4e69 !important; cursor: not-allowed; opacity: 0.5; }

    .input-page-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
      background: #f4e4bc; background-image: radial-gradient(#e3cb98 1px, transparent 1px); background-size: 16px 16px;
      z-index: 50; padding: 20px 16px; padding-top: max(20px, env(safe-area-inset-top)); padding-bottom: max(12px, env(safe-area-inset-bottom));
      flex-direction: column; justify-content: space-between; animation: slideUp 0.3s ease-out; color: #3e2723; border: 6px solid #8d6e63; border-radius: 0;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #8d6e63; padding-bottom: 10px; }
    .modal-header h3 { font-size: 15px; font-weight: 700; color: #4e342e; }
    .close-page-btn { background: none; border: none; color: #8d6e63; font-size: 20px; cursor: pointer; font-weight: 700; }

    .submit-quest-btn {
      width: 100%; padding: 12px; background: #8d6e63; color: #fff8e1; border: 2px solid #4e342e; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .submit-quest-btn:active { transform: scale(0.98); background: #6d4c41; }

    .input-form-body { display: flex; flex-direction: column; gap: 14px; margin-top: 10px; flex: 1; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 12px; color: #5d4037; font-weight: 700; }
    .quest-input-full { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #a1887f; background: #fff8e1; color: #3e2723; font-size: 13px; font-weight: 700; }
    .date-picker-input { width: 100%; padding: 10px; border-radius: 10px; border: 2px solid #a1887f; background: #fff8e1; color: #3e2723; font-size: 13px; font-weight: 700; cursor: pointer; }

    .btn-toggle-box { display: flex; gap: 6px; }
    .opt-btn { flex: 1; padding: 9px 4px; background: #efebe9; border: 2px solid #a1887f; color: #6d4c41; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s; }
    .opt-btn.active-type { background: #5c6bc0; color: white; border-color: #3f51b5; }
    .opt-btn-easy.active-diff { background: #4caf50; color: white; border-color: #2e7d32; }
    .opt-btn-medium.active-diff { background: #ffb300; color: #3e2723; border-color: #ff8f00; }
    .opt-btn-hard.active-diff { background: #e53935; color: white; border-color: #c62828; }

    .level-up-modal, .avatar-select-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 2px solid var(--accent-color); padding: 20px; border-radius: 20px; text-align: center; animation: pop 0.3s ease-out; width: 100%; max-width: 320px;
    }
    @keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }
    .modal-box h2 { font-family: 'Press Start 2P', cursive; color: var(--accent-color); margin-bottom: 12px; font-size: 16px; }
    .modal-box p { font-size: 12px; line-height: 1.5; color: #fff; }
    .modal-box button { margin-top: 14px; width: 100%; padding: 10px; background: var(--accent-color); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; }

    .random-box-container {
      font-size: 50px; margin: 15px 0; cursor: pointer; animation: bounce 0.6s infinite alternate; user-select: none;
    }
    @keyframes bounce { from { transform: translateY(0) scale(1); } to { transform: translateY(-10px) scale(1.1); } }
    .bonus-result-text { font-size: 14px; font-weight: 700; color: #2ecc71; margin-top: 10px; }

    .reset-game-btn { background: #c62828 !important; color: white !important; margin-top: 8px !important; font-size: 11px !important; opacity: 0.9; }
    .reset-game-btn:active { transform: scale(0.95); opacity: 1; }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="top-header-bar">
      <div class="today-date-text" id="todayDateView">📅 날짜 로딩 중...</div>
      <button class="notification-btn" id="notifToggleBtn" onclick="toggleNotificationPermission()">🔔 알림 켜기</button>
    </div>

    <!-- Canvas 스테이지 영역 -->
    <div class="battle-stage-canvas-wrapper">
      <canvas id="gameCanvas"></canvas>
      
      <div class="hero-profile-overlay">
        <div class="hero-info-box">
          <div class="hero-level" id="heroLevel">LV. 1 <span class="hero-badge-inline" id="heroBadge">🌱 초보</span></div>
          <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="expFill"></div>
            <div class="exp-text" id="expText">0 / 100 EXP</div>
          </div>
        </div>
        <button class="icon-add-btn" id="openAddModalBtn">➕</button>
      </div>
    </div>

    <div class="quest-list-container">
      <div class="quest-list" id="questList"></div>
    </div>

    <div class="input-page-modal" id="inputPageModal">
      <div class="modal-header">
        <h3>📜 퀘스트 수락서 작성</h3>
        <button class="close-page-btn" id="closePageBtn">✕</button>
      </div>

      <button class="submit-quest-btn" id="submitQuestBtn">⚔️ 퀘스트 수락 완료</button>

      <div class="input-form-body">
        <div class="form-group">
          <label>퀘스트 목표</label>
          <input type="text" class="quest-input-full" id="questInput" placeholder="예: 매일 운동 30분 하기">
        </div>

        <div class="form-group">
          <label>퀘스트 유형</label>
          <div class="btn-toggle-box">
            <div class="opt-btn active-type" id="typeDailyBtn" onclick="selectType('daily')">🔄 일일 (매일 반복)</div>
            <div class="opt-btn" id="typeOnceBtn" onclick="selectType('once')">📜 일반 (1회성)</div>
          </div>
        </div>

        <div class="form-group" id="dateGroup" style="display: none;">
          <label>목표 날짜 지정 (달력 선택)</label>
          <input type="date" class="date-picker-input" id="questDateInput">
        </div>

        <div class="form-group">
          <label>난이도 설정</label>
          <div class="btn-toggle-box">
            <div class="opt-btn opt-btn-easy" id="diff10Btn" onclick="selectDiff(10)">🟢 쉬움 (+10 EXP)</div>
            <div class="opt-btn opt-btn-medium active-diff" id="diff20Btn" onclick="selectDiff(20)">🟡 보통 (+20 EXP)</div>
            <div class="opt-btn opt-btn-hard" id="diff40Btn" onclick="selectDiff(40)">🔴 어려움 (+40 EXP)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="level-up-modal" id="levelUpModal">
    <div class="modal-box">
      <h2>LEVEL UP!</h2>
      <p id="levelUpMsg">레벨이 상승했습니다! 🎉</p>
      
      <div class="random-box-container" id="randomBox" onclick="openRandomBox()">🎁</div>
      <div class="bonus-result-text" id="bonusResultText">상자를 터치하여 50~200 보너스 EXP를 획득하세요!</div>

      <button id="closeModal" style="display: none;">성장 완료!</button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/lifequest/sw.js').catch(err => console.log(err));
      });
    }

    let level = parseInt(localStorage.getItem('quest_level')) || 1;
    let currentExp = parseInt(localStorage.getItem('quest_exp')) || 0;
    let lastResetDate = localStorage.getItem('quest_last_reset') || '';
    let isNotificationEnabled = localStorage.getItem('quest_notif_enabled') === 'true';

    let selectedType = 'daily';
    let selectedDiff = 20;
    let isBattleProcessing = false;
    let isRandomBoxOpened = false;

    let quests = JSON.parse(localStorage.getItem('quest_list_v2')) || [];

    /* ==========================================
       CANVAS 2D RPG ENGINE (패럴랙스 & 전투 연출)
       ========================================== */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);

    function getThemeByLevel(lvl) {
      if (lvl >= 50) return { sky: '#11052C', mountain: '#3D087B', ground: '#F43B86', grass: '#FFE459' };
      if (lvl >= 30) return { sky: '#1A0000', mountain: '#4A0E17', ground: '#2E0000', grass: '#E74C3C' };
      if (lvl >= 15) return { sky: '#0B132B', mountain: '#1C2541', ground: '#3A506B', grass: '#5BC0BE' };
      return { sky: '#1b2a47', mountain: '#2d4059', ground: '#2b3a42', grass: '#2ecc71' };
    }

    let bgScrollX = 0;
    let isScrolling = true;

    // 히어로 상태 관리
    const hero = {
      x: 50,
      y: 0,
      width: 28,
      height: 36,
      walkFrame: 0,
      animTimer: 0,
      state: 'WALK', // 'WALK', 'DEAD'
      visible: true,
      blinkTimer: 0,
      rotation: 0
    };

    // 몬스터 상태 관리
    const monster = {
      x: 9999,
      y: 0,
      width: 32,
      height: 38,
      visible: false,
      blinkTimer: 0,
      attackTimer: 0
    };

    let laserBeam = null;
    let fireBall = null;
    let particles = [];
    let damageNumbers = [];

    function spawnParticles(x, y, color, count = 25) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x: x,
          y: y,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          size: Math.random() * 4 + 2,
          color: color,
          alpha: 1,
          life: 0.04
        });
      }
    }

    function spawnDamageNumber(x, y, text, color) {
      damageNumbers.push({
        x: x,
        y: y,
        text: text,
        color: color,
        alpha: 1,
        scale: 1.5
      });
    }

    let lastTime = performance.now();
    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;

      updateGame(dt);
      drawGame();

      requestAnimationFrame(gameLoop);
    }

    function updateGame(dt) {
      if (isScrolling) {
        bgScrollX += 60 * dt;
      }

      hero.animTimer += dt;
      if (hero.animTimer > 0.15) {
        hero.walkFrame = (hero.walkFrame + 1) % 4;
        hero.animTimer = 0;
      }

      const groundY = canvas.height - 35;
      const bounceY = (isScrolling && hero.state === 'WALK') ? Math.sin(bgScrollX * 0.15) * 3 : 0;
      
      if (hero.state === 'WALK') {
        hero.y = groundY - hero.height + bounceY;
        hero.rotation = 0;
      } else if (hero.state === 'DEAD') {
        hero.y = groundY - 14; // 바닥으로 쓰러짐
        hero.rotation = 90 * (Math.PI / 180);
      }

      if (monster.visible) {
        monster.x = canvas.width - 70;
        monster.y = groundY - monster.height;

        monster.attackTimer += dt;
        if (monster.attackTimer > 2.0 && isScrolling) {
          fireBall = {
            x: monster.x,
            y: monster.y + 10,
            vx: -180,
            size: 6,
            isSmall: true
          };
          monster.attackTimer = 0;
        }
      }

      if (fireBall && fireBall.isSmall) {
        fireBall.x += fireBall.vx * dt;
        if (fireBall.x < hero.x + hero.width) {
          spawnParticles(hero.x + 10, hero.y + 15, '#e74c3c', 8);
          fireBall = null;
        }
      }

      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.life;
        if (p.alpha <= 0) particles.splice(idx, 1);
      });

      damageNumbers.forEach((d, idx) => {
        d.y -= 20 * dt;
        d.alpha -= 0.8 * dt;
        if (d.scale > 1) d.scale -= 1 * dt;
        if (d.alpha <= 0) damageNumbers.splice(idx, 1);
      });

      if (hero.blinkTimer > 0) hero.blinkTimer -= dt;
      if (monster.blinkTimer > 0) monster.blinkTimer -= dt;
    }

    function drawGame() {
      if (!canvas.width || !canvas.height) return;
      const theme = getThemeByLevel(level);
      const groundY = canvas.height - 35;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = theme.sky;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = theme.mountain;
      for (let i = -1; i < 3; i++) {
        const mx = (i * 180) - ((bgScrollX * 0.3) % 180);
        ctx.beginPath();
        ctx.moveTo(mx, groundY);
        ctx.lineTo(mx + 90, groundY - 60);
        ctx.lineTo(mx + 180, groundY);
        ctx.fill();
      }

      ctx.fillStyle = theme.ground;
      ctx.fillRect(0, groundY, canvas.width, 35);

      ctx.fillStyle = theme.grass;
      ctx.fillRect(0, groundY, canvas.width, 4);
      for (let i = -1; i < canvas.width / 20 + 1; i++) {
        const gx = (i * 20) - ((bgScrollX) % 20);
        ctx.fillRect(gx, groundY - 3, 10, 3);
      }

      // 히어로 렌더링 (사망/피격 애니메이션 수정)
      if (hero.visible && !(hero.blinkTimer > 0 && Math.floor(performance.now() / 80) % 2 === 0)) {
        ctx.save();
        ctx.translate(hero.x + hero.width / 2, hero.y + hero.height / 2);
        if (hero.rotation !== 0) ctx.rotate(hero.rotation);
        ctx.translate(-(hero.x + hero.width / 2), -(hero.y + hero.height / 2));

        ctx.fillStyle = '#f39c12';
        ctx.fillRect(hero.x, hero.y + 10, hero.width, 18);
        
        ctx.fillStyle = '#ffcc99';
        ctx.fillRect(hero.x + 4, hero.y, 20, 12);

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(hero.x - 4, hero.y + 10, 6, 20);

        ctx.fillStyle = '#2c3e50';
        if (hero.state === 'WALK') {
          if (hero.walkFrame % 2 === 0) {
            ctx.fillRect(hero.x + 4, hero.y + 28, 6, 8);
            ctx.fillRect(hero.x + 18, hero.y + 26, 6, 6);
          } else {
            ctx.fillRect(hero.x + 4, hero.y + 26, 6, 6);
            ctx.fillRect(hero.x + 18, hero.y + 28, 6, 8);
          }
        }
        ctx.restore();
      }

      if (monster.visible && !(monster.blinkTimer > 0 && Math.floor(performance.now() / 80) % 2 === 0)) {
        ctx.save();
        ctx.fillStyle = '#8e44ad';
        ctx.beginPath();
        ctx.arc(monster.x + 16, monster.y + 18, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(monster.x + 6, monster.y + 10, 6, 6);
        ctx.fillRect(monster.x + 20, monster.y + 10, 6, 6);
        ctx.restore();
      }

      if (laserBeam) {
        ctx.save();
        ctx.fillStyle = '#00ffff';
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 15;
        ctx.fillRect(laserBeam.x, laserBeam.y, laserBeam.width, laserBeam.height);
        ctx.restore();
      }

      if (fireBall) {
        ctx.save();
        ctx.fillStyle = '#ff3300';
        ctx.shadowColor = '#ff6600';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(fireBall.x, fireBall.y, fireBall.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.restore();
      });

      damageNumbers.forEach(d => {
        ctx.save();
        ctx.globalAlpha = d.alpha;
        ctx.font = '700 14px "Press Start 2P", sans-serif';
        ctx.fillStyle = d.color;
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.fillText(d.text, d.x, d.y);
        ctx.restore();
      });
    }

    // 클리어 연출
    function triggerClearCanvasBattle(expGain, callback) {
      isScrolling = false;
      monster.visible = true;
      monster.x = canvas.width - 70;

      setTimeout(() => {
        laserBeam = {
          x: hero.x + hero.width,
          y: hero.y + 12,
          width: monster.x - (hero.x + hero.width),
          height: 12
        };
        play8BitHitSound();

        setTimeout(() => {
          laserBeam = null;
          monster.blinkTimer = 0.6;
          spawnDamageNumber(monster.x - 10, monster.y - 10, `-${expGain * 100}`, '#00ffff');

          setTimeout(() => {
            spawnParticles(monster.x + 16, monster.y + 18, '#9b59b6', 40);
            monster.visible = false;
            isScrolling = true;
            if (callback) callback();
          }, 600);
        }, 300);
      }, 500);
    }

    // 실패 연출 (버그 수정: 내 캐릭터 피격/사망/부활)
    function triggerFailCanvasBattle(expLoss, callback) {
      isScrolling = false;
      monster.visible = true;
      monster.x = canvas.width - 70;

      setTimeout(() => {
        fireBall = {
          x: monster.x,
          y: monster.y + 15,
          vx: -350,
          size: 14,
          isSmall: false
        };

        const fireInterval = setInterval(() => {
          if (fireBall && fireBall.x <= hero.x + hero.width) {
            clearInterval(fireInterval);
            fireBall = null;
            play8BitFailSound();
            
            // 피격 및 데미지
            hero.blinkTimer = 0.6;
            spawnDamageNumber(hero.x - 5, hero.y - 10, `-${expLoss} EXP`, '#ff0055');
            spawnParticles(hero.x + 10, hero.y + 15, '#e74c3c', 30);

            setTimeout(() => {
              // 붉게 깜빡인 후 쓰러짐 (DEAD)
              hero.state = 'DEAD';
              
              setTimeout(() => {
                // 부활 준비 (사라졌다가 다시 짠)
                hero.visible = false;
                spawnParticles(hero.x + 14, hero.y + 18, '#ffcc99', 20);

                setTimeout(() => {
                  hero.state = 'WALK';
                  hero.visible = true;
                  hero.blinkTimer = 0.5;
                  monster.visible = false;
                  isScrolling = true;
                  if (callback) callback();
                }, 600);
              }, 600);
            }, 600);
          }
        }, 16);
      }, 500);
    }

    /* ==========================================
       PWA & 게임 데이터 처리 로직
       ========================================== */
    function updateTodayDateDisplay() {
      const now = new Date();
      const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' };
      const dateStr = now.toLocaleDateString('ko-KR', options);
      document.getElementById('todayDateView').textContent = `📅 ${dateStr}`;
    }

    function toggleNotificationPermission() {
      if (!('Notification' in window)) {
        alert('이 브라우저는 모바일 알림을 지원하지 않습니다.');
        return;
      }

      if (!isNotificationEnabled) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            isNotificationEnabled = true;
            localStorage.setItem('quest_notif_enabled', 'true');
            updateNotificationBtnStatus();
            sendNotification('🔔 알림 켜짐', 'Life Quest 레벨 업 및 시간별 알림이 활성화되었습니다.');
          } else {
            alert('스마트폰 브라우저 설정에서 알림 권한을 허용해 주세요.');
          }
        });
      } else {
        isNotificationEnabled = false;
        localStorage.setItem('quest_notif_enabled', 'false');
        updateNotificationBtnStatus();
        alert('알림 기능이 끄기 상태로 변경되었습니다.');
      }
    }

    function updateNotificationBtnStatus() {
      const btn = document.getElementById('notifToggleBtn');
      if (!('Notification' in window)) {
        btn.style.display = 'none';
        return;
      }
      if (isNotificationEnabled && Notification.permission === 'granted') {
        btn.textContent = '🔔 알림 켜짐';
        btn.style.background = '#2ecc71';
        btn.style.color = '#fff';
      } else {
        btn.textContent = '🔕 알림 끔';
        btn.style.background = '#3a3f51';
        btn.style.color = '#ccc';
      }
    }

    function sendNotification(title, body) {
      if (isNotificationEnabled && 'Notification' in window && Notification.permission === 'granted') {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          navigator.serviceWorker.ready.then(reg => {
            reg.showNotification(title, {
              body: body,
              icon: 'icon.png',
              badge: 'icon.png',
              vibrate: [100, 50, 100]
            });
          });
        } else {
          new Notification(title, { body: body });
        }
      }
    }

    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function play8BitHitSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function play8BitVictorySound() {
      initAudio();
      const notes = [261.63, 329.63, 392.00, 523.25];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + idx * 0.1 + 0.15);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + idx * 0.1);
        osc.stop(audioCtx.currentTime + idx * 0.1 + 0.15);
      });
    }

    function play8BitFailSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.setValueAtTime(180, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(100, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    }

    function getMaxExp(lvl = level) {
      return lvl * 100;
    }

    function getKSTDateString() {
      const formatter = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Asia/Seoul' });
      return formatter.format(new Date());
    }

    function checkDailyReset() {
      const todayKST = getKSTDateString();
      if (lastResetDate !== todayKST && lastResetDate !== '') {
        let totalPenalty = 0;
        quests.forEach(q => {
          if (q.type === 'daily') {
            if (!q.completed) totalPenalty += q.exp;
            q.completed = false; // 매일 리셋 시 다시 수행 가능 상태로 만듦
          }
        });

        if (totalPenalty > 0) loseExp(totalPenalty);

        lastResetDate = todayKST;
        localStorage.setItem('quest_last_reset', lastResetDate);
        saveData();
      } else if (lastResetDate === '') {
        lastResetDate = todayKST;
        localStorage.setItem('quest_last_reset', lastResetDate);
      }
    }

    function saveData() {
      localStorage.setItem('quest_level', level);
      localStorage.setItem('quest_exp', currentExp);
      localStorage.setItem('quest_list_v2', JSON.stringify(quests));
    }

    function getLevelBadge(lvl) {
      if (lvl >= 77) return "👑 신화적 존재";
      if (lvl >= 70) return "🔥 초월자";
      if (lvl >= 60) return "⚡ 정점의 영웅";
      if (lvl >= 50) return "🌟 영웅";
      if (lvl >= 40) return "💎 대마법사";
      if (lvl >= 30) return "⚔️ 상급 기사";
      if (lvl >= 20) return "🥇 정예 기사";
      if (lvl >= 10) return "🥈 수련 기사";
      if (lvl >= 5)  return "🥉 견습 모험가";
      return "🌱 초보 모험가";
    }

    function updateProfile() {
      const maxExp = getMaxExp();
      document.getElementById('heroLevel').innerHTML = `LV. ${level} <span class="hero-badge-inline">${getLevelBadge(level)}</span>`;
      
      const expPercent = Math.min((currentExp / maxExp) * 100, 100);
      document.getElementById('expFill').style.width = `${expPercent}%`;
      document.getElementById('expText').textContent = `${currentExp} / ${maxExp} EXP`;
    }

    document.getElementById('openAddModalBtn').addEventListener('click', () => {
      if (isBattleProcessing) return;
      document.getElementById('questDateInput').value = getKSTDateString();
      document.getElementById('inputPageModal').style.display = 'flex';
    });

    document.getElementById('closePageBtn').addEventListener('click', () => {
      document.getElementById('inputPageModal').style.display = 'none';
    });

    function selectType(type) {
      selectedType = type;
      document.getElementById('typeDailyBtn').classList.remove('active-type');
      document.getElementById('typeOnceBtn').classList.remove('active-type');
      
      const dateGroup = document.getElementById('dateGroup');
      if (type === 'daily') {
        document.getElementById('typeDailyBtn').classList.add('active-type');
        dateGroup.style.display = 'none';
      } else {
        document.getElementById('typeOnceBtn').classList.add('active-type');
        dateGroup.style.display = 'flex';
      }
    }

    function selectDiff(exp) {
      selectedDiff = exp;
      document.getElementById('diff10Btn').classList.remove('active-diff');
      document.getElementById('diff20Btn').classList.remove('active-diff');
      document.getElementById('diff40Btn').classList.remove('active-diff');

      if (exp === 10) document.getElementById('diff10Btn').classList.add('active-diff');
      if (exp === 20) document.getElementById('diff20Btn').classList.add('active-diff');
      if (exp === 40) document.getElementById('diff40Btn').classList.add('active-diff');
    }

    function renderQuests() {
      const listEl = document.getElementById('questList');
      listEl.innerHTML = '';

      const todayKST = getKSTDateString();
      const visibleQuests = quests.map((q, originalIndex) => ({ ...q, originalIndex }))
        .filter(q => q.type === 'daily' || (q.type === 'once' && q.targetDate === todayKST));

      if (visibleQuests.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">📜 오늘 수행할 퀘스트가 없습니다.<br>상단 + 버튼을 눌러 새 퀘스트를 등록해 보세요!</div>';
        return;
      }

      const sortedQuests = visibleQuests.sort((a, b) => (a.completed === b.completed ? 0 : a.completed ? 1 : -1));

      sortedQuests.forEach((q) => {
        const index = q.originalIndex;
        const card = document.createElement('div');
        card.className = `quest-card ${q.completed ? 'completed-card' : ''}`;
        
        const typeBadge = q.type === 'daily' 
          ? '<span class="quest-type-badge badge-daily">일일</span>' 
          : '<span class="quest-type-badge badge-once">일반</span>';

        const diffText = q.exp === 10 ? '쉬움 (+10)' : (q.exp === 40 ? '어려움 (+40)' : '보통 (+20)');

        card.innerHTML = `
          <div class="quest-info">
            <div class="quest-title">${typeBadge} ${q.text}</div>
            <div class="difficulty-tag">난이도: ${diffText}</div>
          </div>
          <div class="quest-actions">
            <button class="clear-btn" id="btn-clear-${index}" ${q.completed || isBattleProcessing ? 'disabled' : ''} onclick="clearQuestWithBattle(${index})">
              ${q.completed ? '완료됨 ✔' : '클리어'}
            </button>
            <button class="fail-btn" id="btn-fail-${index}" ${q.completed || isBattleProcessing ? 'disabled' : ''} onclick="failQuest(${index})">
              실패
            </button>
            <button class="remove-btn" ${isBattleProcessing ? 'disabled' : ''} title="단순 삭제" onclick="removeQuestWithoutPenalty(${index})">✕</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function toggleAllButtons(disable) {
      document.querySelectorAll('.clear-btn, .fail-btn, .remove-btn').forEach(btn => {
        btn.disabled = disable;
      });
    }

    function clearQuestWithBattle(index) {
      if (isBattleProcessing) return;
      const q = quests[index];
      if (q.completed) return;

      isBattleProcessing = true;
      toggleAllButtons(true);

      triggerClearCanvasBattle(q.exp, () => {
        q.completed = true;
        sendNotification('⚔️ 퀘스트 성공!', `'${q.text}' 클리어! (+${q.exp} EXP를 획득했습니다)`);

        gainExp(q.exp);

        // 1회성 퀘스트만 완료 시 삭제 (일일 퀘스트는 남겨둠)
        if (q.type === 'once') {
          quests.splice(index, 1);
        }

        saveData();
        isBattleProcessing = false;
        renderQuests();
      });
    }

    function loseExp(amount) {
      currentExp -= amount;
      while (currentExp < 0) {
        if (level > 1) {
          level--;
          currentExp += getMaxExp(level);
        } else {
          level = 1;
          currentExp = 0;
          break;
        }
      }
      saveData();
      updateProfile();
    }

    // 버그 수정: 실패 시 일일 퀘스트는 삭제하지 않고 1회성 퀘스트만 삭제
    function failQuest(index) {
      if (isBattleProcessing) return;
      const q = quests[index];
      if (q.completed) return;

      isBattleProcessing = true;
      toggleAllButtons(true);

      const penaltyExp = q.exp;

      triggerFailCanvasBattle(penaltyExp, () => {
        sendNotification('💥 퀘스트 실패!', `'${q.text}' 퀘스트에 실패했습니다. (-${penaltyExp} EXP 감가)`);

        // 1회성 퀘스트만 실패 시 삭제
        if (q.type === 'once') {
          quests.splice(index, 1);
        }
        loseExp(penaltyExp);
        
        isBattleProcessing = false;
        renderQuests();
      });
    }

    function removeQuestWithoutPenalty(index) {
      if (isBattleProcessing) return;
      quests.splice(index, 1);
      saveData();
      renderQuests();
    }

    function gainExp(amount) {
      currentExp += amount;
      let maxExp = getMaxExp();
      
      if (currentExp >= maxExp) {
        if (level < 77) {
          currentExp -= maxExp;
          level++;
          showLevelUpModal();
        } else {
          level = 77;
          currentExp = getMaxExp(77);
        }
      }
      saveData();
      updateProfile();
    }

    function showLevelUpModal() {
      sendNotification('🎉 LEVEL UP!', `축하합니다! LV. ${level} (${getLevelBadge(level)})로 승급했습니다!`);
      
      isRandomBoxOpened = false;
      document.getElementById('randomBox').style.display = 'block';
      document.getElementById('randomBox').textContent = '🎁';
      document.getElementById('bonusResultText').textContent = '상자를 터치하여 50~200 보너스 EXP를 획득하세요!';
      document.getElementById('closeModal').style.display = 'none';

      document.getElementById('levelUpMsg').textContent = `축하합니다! LV. ${level} 승급 완료!\n[${getLevelBadge(level)}] 칭호를 획득했습니다.`;
      document.getElementById('levelUpModal').style.display = 'flex';
    }

    function openRandomBox() {
      if (isRandomBoxOpened) return;
      isRandomBoxOpened = true;

      play8BitVictorySound();
      const bonusExp = Math.floor(Math.random() * 151) + 50;
      
      document.getElementById('randomBox').textContent = '💎';
      document.getElementById('bonusResultText').textContent = `🎉 축하합니다! +${bonusExp} 보너스 EXP 획득!`;
      document.getElementById('closeModal').style.display = 'block';

      currentExp += bonusExp;
      saveData();
      updateProfile();
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('levelUpModal').style.display = 'none';
    });

    document.getElementById('submitQuestBtn').addEventListener('click', () => {
      const input = document.getElementById('questInput');
      const text = input.value.trim();
      if (!text) return;

      const dateVal = document.getElementById('questDateInput').value || getKSTDateString();

      quests.push({
        text: text,
        type: selectedType,
        exp: selectedDiff,
        targetDate: selectedType === 'once' ? dateVal : null,
        completed: false
      });

      saveData();
      renderQuests();
      input.value = '';
      document.getElementById('inputPageModal').style.display = 'none';
    });

    let lastNotified11PMDate = localStorage.getItem('quest_last_notified_11pm') || '';
    let lastAutoFailedDate = localStorage.getItem('quest_last_autofailed') || '';

    // 버그 수정: 밤 11:50분 자동 실패 시에도 일일 퀘스트는 삭제되지 않음
    function checkNightSchedules() {
      const now = new Date();
      const todayKST = getKSTDateString();
      const hours = now.getHours();
      const minutes = now.getMinutes();

      const uncompletedQuests = quests.filter(q => !q.completed && (q.type === 'daily' || (q.type === 'once' && q.targetDate === todayKST)));

      if (hours === 23 && minutes >= 0 && minutes < 50 && lastNotified11PMDate !== todayKST) {
        if (uncompletedQuests.length > 0) {
          sendNotification('⏰ [LifeQuest] 미완료 퀘스트 알림!', `오늘 완료하지 않은 퀘스트가 ${uncompletedQuests.length}개 남아있습니다! 11시 50분 전에 클리어하세요.`);
        }
        lastNotified11PMDate = todayKST;
        localStorage.setItem('quest_last_notified_11pm', todayKST);
      }

      if (hours === 23 && minutes >= 50 && lastAutoFailedDate !== todayKST) {
        let failedCount = 0;
        let totalPenalty = 0;

        quests = quests.filter(q => {
          const isTodayQuest = q.type === 'daily' || (q.type === 'once' && q.targetDate === todayKST);
          if (isTodayQuest && !q.completed) {
            failedCount++;
            totalPenalty += q.exp;
            // 1회성 퀘스트만 자동 실패 시 삭제
            return q.type === 'daily'; 
          }
          return true;
        });

        if (failedCount > 0) {
          loseExp(totalPenalty);
          sendNotification('💥 [LifeQuest] 11시 50분 자동 실패!', `오늘 미완료 퀘스트 ${failedCount}개가 실패 처리되었습니다. (-${totalPenalty} EXP 감가)`);
        }

        lastAutoFailedDate = todayKST;
        localStorage.setItem('quest_last_autofailed', todayKST);
        saveData();
        renderQuests();
      }
    }

    function startScheduleWatcher() {
      checkNightSchedules();
      setInterval(checkNightSchedules, 10000);
    }

    resizeCanvas();
    requestAnimationFrame(gameLoop);

    updateTodayDateDisplay();
    updateNotificationBtnStatus();
    checkDailyReset();
    updateProfile();
    renderQuests();
    startScheduleWatcher();
  </script>
</body>
