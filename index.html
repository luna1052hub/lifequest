<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIFE QUEST - RPG Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #2d313e;
      --accent-color: #f39c12;
      --success-color: #2ecc71;
      --text-color: #ffffff;
      --border-color: #4a4e69;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .game-container {
      background: var(--card-bg); width: 100%; max-width: 420px; min-height: 600px; border-radius: 20px; padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--border-color); display: flex; flex-direction: column; gap: 20px; justify-content: space-between;
    }

    /* 캐릭터 프로필 & EXP 바 */
    .hero-profile {
      background: #21242d; border-radius: 14px; padding: 16px; display: flex; align-items: center; gap: 16px; border: 1px solid var(--border-color);
    }
    .hero-avatar { font-size: 44px; background: #3a3f51; padding: 8px; border-radius: 12px; }
    .hero-info { flex: 1; }
    .hero-level { font-family: 'Press Start 2P', cursive; font-size: 13px; color: var(--accent-color); margin-bottom: 8px; }
    .exp-bar-bg { background: #1a1c23; height: 18px; border-radius: 9px; overflow: hidden; border: 1px solid #4a4e69; position: relative; }
    .exp-bar-fill { background: linear-gradient(90deg, #f1c40f, #e67e22); height: 100%; width: 0%; transition: width 0.3s ease; }
    .exp-text { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 700; top: 0; line-height: 18px; color: #fff; text-shadow: 1px 1px 2px #000; }

    /* 퀘스트 입력폼 */
    .quest-input-box { display: flex; gap: 8px; }
    .quest-input {
      flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); background: #1a1c23; color: white; font-size: 14px;
    }
    .quest-add-btn {
      padding: 12px 16px; background: var(--accent-color); color: white; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: transform 0.1s;
    }
    .quest-add-btn:active { transform: scale(0.95); }

    /* 퀘스트 목록 */
    .quest-list-container { flex: 1; display: flex; flex-direction: column; }
    .quest-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; }
    .empty-msg { text-align: center; color: #868e96; font-size: 14px; margin: auto; line-height: 1.6; }

    .quest-card {
      background: #21242d; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .quest-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; word-break: break-all; }
    .quest-title span { color: var(--accent-color); font-size: 11px; flex-shrink: 0; }
    .clear-btn {
      background: var(--success-color); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0; margin-left: 8px;
    }
    .clear-btn:active { transform: scale(0.95); }

    /* 레벨업 팝업 */
    .level-up-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 2px solid var(--accent-color); padding: 30px 24px; border-radius: 20px; text-align: center; animation: pop 0.3s ease-out; width: 100%; max-width: 320px;
    }
    @keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }
    .modal-box h2 { font-family: 'Press Start 2P', cursive; color: var(--accent-color); margin-bottom: 16px; font-size: 18px; }
    .modal-box p { font-size: 14px; line-height: 1.5; color: #fff; }
    .modal-box button { margin-top: 20px; width: 100%; padding: 12px; background: var(--accent-color); border: none; border-radius: 10px; color: white; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="game-container">
    <div>
      <!-- 캐릭터 상태 창 -->
      <div class="hero-profile">
        <div class="hero-avatar" id="heroAvatar">⚔️</div>
        <div class="hero-info">
          <div class="hero-level" id="heroLevel">LV. 1 용사</div>
          <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="expFill"></div>
            <div class="exp-text" id="expText">0 / 100 EXP</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 퀘스트 리스트 영역 -->
    <div class="quest-list-container">
      <div class="quest-list" id="questList">
        <div class="empty-msg" id="emptyMsg">📜 현재 수락한 퀘스트가 없습니다.<br>아래에서 오늘 할 일을 수락해 주세요!</div>
      </div>
    </div>

    <!-- 퀘스트 추가 입력 -->
    <div class="quest-input-box">
      <input type="text" class="quest-input" id="questInput" placeholder="새로운 퀘스트 입력 (예: 운동하기)">
      <button class="quest-add-btn" id="addBtn">수락</button>
    </div>
  </div>

  <!-- 레벨업 모달 -->
  <div class="level-up-modal" id="levelUpModal">
    <div class="modal-box">
      <h2>LEVEL UP!</h2>
      <p id="levelUpMsg">레벨이 상승했습니다! 🎉</p>
      <button id="closeModal">성장 완료!</button>
    </div>
  </div>

  <script>
    let level = parseInt(localStorage.getItem('quest_level')) || 1;
    let currentExp = parseInt(localStorage.getItem('quest_exp')) || 0;
    const maxExp = 100;
    const avatars = ['⚔️', '🛡️', '🧙‍♂️', '🥷', '👑', '🐉'];

    let quests = JSON.parse(localStorage.getItem('quest_list')) || [];

    function saveData() {
      localStorage.setItem('quest_level', level);
      localStorage.setItem('quest_exp', currentExp);
      localStorage.setItem('quest_list', JSON.stringify(quests));
    }

    function updateProfile() {
      document.getElementById('heroLevel').textContent = `LV. ${level} 용사`;
      document.getElementById('heroAvatar').textContent = avatars[(level - 1) % avatars.length];
      
      const expPercent = (currentExp / maxExp) * 100;
      document.getElementById('expFill').style.width = `${expPercent}%`;
      document.getElementById('expText').textContent = `${currentExp} / ${maxExp} EXP`;
    }

    function renderQuests() {
      const listEl = document.getElementById('questList');
      listEl.innerHTML = '';

      if (quests.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">📜 현재 수락한 퀘스트가 없습니다.<br>아래에서 오늘 할 일을 수락해 주세요!</div>';
        return;
      }

      quests.forEach((qText, index) => {
        const card = document.createElement('div');
        card.className = 'quest-card';
        card.innerHTML = `
          <div class="quest-title"><span>[📜]</span> ${qText}</div>
          <button class="clear-btn" onclick="clearQuest(${index})">클리어 (+20 EXP)</button>
        `;
        listEl.appendChild(card);
      });
    }

    function gainExp(amount) {
      currentExp += amount;
      if (currentExp >= maxExp) {
        currentExp -= maxExp;
        level++;
        showLevelUpModal();
      }
      saveData();
      updateProfile();
    }

    function showLevelUpModal() {
      document.getElementById('levelUpMsg').textContent = `축하합니다! LV. ${level} 용사로 성장했습니다! 🎉`;
      document.getElementById('levelUpModal').style.display = 'flex';
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('levelUpModal').style.display = 'none';
    });

    function clearQuest(index) {
      quests.splice(index, 1);
      saveData();
      renderQuests();
      gainExp(20);
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const input = document.getElementById('questInput');
      const text = input.value.trim();
      if (!text) return;

      quests.push(text);
      saveData();
      renderQuests();

      input.value = '';
    });

    document.getElementById('questInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('addBtn').click();
    });

    updateProfile();
    renderQuests();
  </script>
</body>
</html>
