<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LIFE QUEST - RPG Todo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #1a1c23;
      --card-bg: #2d313e;
      --accent-color: #f39c12;
      --success-color: #2ecc71;
      --text-color: #ffffff;
      --border-color: #4a4e69;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .game-container {
      background: var(--card-bg); width: 100%; max-width: 420px; min-height: 640px; border-radius: 20px; padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid var(--border-color); display: flex; flex-direction: column; gap: 16px; justify-content: space-between;
    }

    /* 캐릭터 프로필 */
    .hero-profile {
      background: #21242d; border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 14px; border: 1px solid var(--border-color);
    }
    .hero-avatar { font-size: 40px; background: #3a3f51; padding: 6px; border-radius: 12px; }
    .hero-info { flex: 1; }
    .hero-level { font-family: 'Press Start 2P', cursive; font-size: 12px; color: var(--accent-color); margin-bottom: 6px; }
    .exp-bar-bg { background: #1a1c23; height: 16px; border-radius: 8px; overflow: hidden; border: 1px solid #4a4e69; position: relative; }
    .exp-bar-fill { background: linear-gradient(90deg, #f1c40f, #e67e22); height: 100%; width: 0%; transition: width 0.3s ease; }
    .exp-text { position: absolute; width: 100%; text-align: center; font-size: 10px; font-weight: 700; top: 0; line-height: 16px; color: #fff; text-shadow: 1px 1px 2px #000; }

    /* 상단 탭 필터 */
    .tab-group { display: flex; gap: 8px; }
    .tab-btn {
      flex: 1; padding: 10px; background: #21242d; border: 1px solid var(--border-color); border-radius: 10px; color: #868e96; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .tab-btn.active { background: var(--accent-color); color: white; border-color: var(--accent-color); }

    /* 퀘스트 목록 */
    .quest-list-container { flex: 1; display: flex; flex-direction: column; }
    .quest-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
    .empty-msg { text-align: center; color: #868e96; font-size: 13px; margin: auto; line-height: 1.6; }

    .quest-card {
      background: #21242d; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; animation: fadeIn 0.3s;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .quest-info { display: flex; flex-direction: column; gap: 4px; }
    .quest-title { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; word-break: break-all; }
    .quest-type-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; }
    .badge-daily { background: #3498db; color: white; }
    .badge-once { background: #9b59b6; color: white; }
    .difficulty-tag { font-size: 10px; color: #868e96; }

    .quest-actions { display: flex; gap: 6px; align-items: center; }
    .clear-btn {
      background: var(--success-color); color: white; border: none; padding: 8px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; flex-shrink: 0;
    }
    .clear-btn:disabled { background: #4a4e69; cursor: not-allowed; opacity: 0.6; }
    .delete-btn { background: none; border: none; color: #e74c3c; cursor: pointer; font-size: 14px; padding: 4px; }

    /* 퀘스트 입력 양식 (버튼형 UI 적용) */
    .quest-input-wrapper { display: flex; flex-direction: column; gap: 10px; background: #21242d; padding: 12px; border-radius: 12px; border: 1px solid var(--border-color); }
    .quest-input-box { display: flex; gap: 8px; }
    .quest-input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #1a1c23; color: white; font-size: 13px; }
    .quest-add-btn { padding: 10px 14px; background: var(--accent-color); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    
    /* 신규 유형/난이도 버튼 그룹 스타일 */
    .button-option-group { display: flex; flex-direction: column; gap: 8px; }
    .option-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .option-label { font-size: 11px; color: #868e96; font-weight: 700; width: 45px; }
    
    .btn-toggle-box { display: flex; flex: 1; gap: 4px; }
    .opt-btn {
      flex: 1; padding: 6px 4px; background: #1a1c23; border: 1px solid var(--border-color); color: #868e96; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .opt-btn.active-type { background: #3498db; color: white; border-color: #3498db; }
    
    /* 난이도 전용 버튼 색상 지정 */
    .opt-btn-easy.active-diff { background: #2ecc71; color: white; border-color: #2ecc71; }
    .opt-btn-medium.active-diff { background: #f1c40f; color: #1a1c23; border-color: #f1c40f; }
    .opt-btn-hard.active-diff { background: #e74c3c; color: white; border-color: #e74c3c; }

    /* 레벨업 팝업 */
    .level-up-modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8);
      justify-content: center; align-items: center; z-index: 100; padding: 20px;
    }
    .modal-box {
      background: var(--card-bg); border: 2px solid var(--accent-color); padding: 24px; border-radius: 20px; text-align: center; animation: pop 0.3s ease-out; width: 100%; max-width: 320px;
    }
    @keyframes pop { from { transform: scale(0.5); } to { transform: scale(1); } }
    .modal-box h2 { font-family: 'Press Start 2P', cursive; color: var(--accent-color); margin-bottom: 14px; font-size: 18px; }
    .modal-box p { font-size: 13px; line-height: 1.5; color: #fff; }
    .modal-box button { margin-top: 16px; width: 100%; padding: 10px; background: var(--accent-color); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>

  <div class="game-container">
    <div>
      <!-- 캐릭터 프로필 -->
      <div class="hero-profile">
        <div class="hero-avatar" id="heroAvatar">⚔️</div>
        <div class="hero-info">
          <div class="hero-level" id="heroLevel">LV. 1 용사</div>
          <div class="exp-bar-bg">
            <div class="exp-bar-fill" id="expFill"></div>
            <div class="exp-text" id="expText">0 / 100 EXP</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 탭 필터 (전체 / 일일 / 일반) -->
    <div class="tab-group">
      <div class="tab-btn active" onclick="switchTab('all')" id="tabAll">전체 보기</div>
      <div class="tab-btn" onclick="switchTab('daily')" id="tabDaily">🔄 일일 퀘스트</div>
      <div class="tab-btn" onclick="switchTab('once')" id="tabOnce">📜 일반 퀘스트</div>
    </div>

    <!-- 퀘스트 리스트 -->
    <div class="quest-list-container">
      <div class="quest-list" id="questList"></div>
    </div>

    <!-- 퀘스트 입력 창 (버튼식 옵션 선택) -->
    <div class="quest-input-wrapper">
      <div class="quest-input-box">
        <input type="text" class="quest-input" id="questInput" placeholder="새로운 퀘스트 입력...">
        <button class="quest-add-btn" id="addBtn">수락</button>
      </div>
      
      <div class="button-option-group">
        <!-- 1. 유형 선택 버튼 -->
        <div class="option-row">
          <span class="option-label">유형</span>
          <div class="btn-toggle-box">
            <div class="opt-btn active-type" id="typeDailyBtn" onclick="selectType('daily')">🔄 일일 (반복)</div>
            <div class="opt-btn" id="typeOnceBtn" onclick="selectType('once')">📜 일반 (1회)</div>
          </div>
        </div>

        <!-- 2. 난이도 선택 버튼 -->
        <div class="option-row">
          <span class="option-label">난이도</span>
          <div class="btn-toggle-box">
            <div class="opt-btn opt-btn-easy" id="diff10Btn" onclick="selectDiff(10)">🟢 쉬움(+10)</div>
            <div class="opt-btn opt-btn-medium active-diff" id="diff20Btn" onclick="selectDiff(20)">🟡 보통(+20)</div>
            <div class="opt-btn opt-btn-hard" id="diff40Btn" onclick="selectDiff(40)">🔴 어려움(+40)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 레벨업 모달 -->
  <div class="level-up-modal" id="levelUpModal">
    <div class="modal-box">
      <h2>LEVEL UP!</h2>
      <p id="levelUpMsg">레벨이 상승했습니다! 🎉</p>
      <button id="closeModal">성장 완료!</button>
    </div>
  </div>

  <script>
    let level = parseInt(localStorage.getItem('quest_level')) || 1;
    let currentExp = parseInt(localStorage.getItem('quest_exp')) || 0;
    let lastResetDate = localStorage.getItem('quest_last_reset') || '';
    let currentTab = 'all';

    // 신규 선택 상태 변수 (기본값 설정)
    let selectedType = 'daily';
    let selectedDiff = 20;

    const avatars = ['⚔️', '🛡️', '🧙‍♂️', '🥷', '👑', '🐉'];
    let quests = JSON.parse(localStorage.getItem('quest_list_v2')) || [];

    function getMaxExp() {
      return level * 100;
    }

    function checkDailyReset() {
      const today = new Date().toDateString();
      if (lastResetDate !== today) {
        quests.forEach(q => {
          if (q.type === 'daily') q.completed = false;
        });
        lastResetDate = today;
        localStorage.setItem('quest_last_reset', lastResetDate);
        saveData();
      }
    }

    function saveData() {
      localStorage.setItem('quest_level', level);
      localStorage.setItem('quest_exp', currentExp);
      localStorage.setItem('quest_list_v2', JSON.stringify(quests));
    }

    function updateProfile() {
      const maxExp = getMaxExp();
      document.getElementById('heroLevel').textContent = `LV. ${level} 용사`;
      document.getElementById('heroAvatar').textContent = avatars[(level - 1) % avatars.length];
      
      const expPercent = Math.min((currentExp / maxExp) * 100, 100);
      document.getElementById('expFill').style.width = `${expPercent}%`;
      document.getElementById('expText').textContent = `${currentExp} / ${maxExp} EXP`;
    }

    /* 퀘스트 유형 버튼 선택 핸들러 */
    function selectType(type) {
      selectedType = type;
      document.getElementById('typeDailyBtn').classList.remove('active-type');
      document.getElementById('typeOnceBtn').classList.remove('active-type');

      if (type === 'daily') {
        document.getElementById('typeDailyBtn').classList.add('active-type');
      } else {
        document.getElementById('typeOnceBtn').classList.add('active-type');
      }
    }

    /* 난이도 버튼 선택 핸들러 */
    function selectDiff(exp) {
      selectedDiff = exp;
      document.getElementById('diff10Btn').classList.remove('active-diff');
      document.getElementById('diff20Btn').classList.remove('active-diff');
      document.getElementById('diff40Btn').classList.remove('active-diff');

      if (exp === 10) document.getElementById('diff10Btn').classList.add('active-diff');
      if (exp === 20) document.getElementById('diff20Btn').classList.add('active-diff');
      if (exp === 40) document.getElementById('diff40Btn').classList.add('active-diff');
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if(tab === 'all') document.getElementById('tabAll').classList.add('active');
      if(tab === 'daily') document.getElementById('tabDaily').classList.add('active');
      if(tab === 'once') document.getElementById('tabOnce').classList.add('active');
      renderQuests();
    }

    function renderQuests() {
      const listEl = document.getElementById('questList');
      listEl.innerHTML = '';

      const filtered = quests.filter(q => {
        if (currentTab === 'daily') return q.type === 'daily';
        if (currentTab === 'once') return q.type === 'once';
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-msg">📜 수락한 퀘스트가 없습니다.<br>아래에서 할 일을 수락해 보세요!</div>';
        return;
      }

      filtered.forEach((q) => {
        const index = quests.indexOf(q);
        const card = document.createElement('div');
        card.className = 'quest-card';
        
        const typeBadge = q.type === 'daily' 
          ? '<span class="quest-type-badge badge-daily">일일</span>' 
          : '<span class="quest-type-badge badge-once">일반</span>';

        const diffText = q.exp === 10 ? '쉬움 (+10)' : (q.exp === 40 ? '어려움 (+40)' : '보통 (+20)');

        card.innerHTML = `
          <div class="quest-info">
            <div class="quest-title">${typeBadge} ${q.text}</div>
            <div class="difficulty-tag">난이도: ${diffText}</div>
          </div>
          <div class="quest-actions">
            <button class="clear-btn" ${q.completed ? 'disabled' : ''} onclick="clearQuest(${index})">
              ${q.completed ? '완료됨 ✔' : '클리어'}
            </button>
            <button class="delete-btn" onclick="deleteQuest(${index})">✕</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function gainExp(amount) {
      currentExp += amount;
      const maxExp = getMaxExp();
      
      if (currentExp >= maxExp) {
        currentExp -= maxExp;
        level++;
        showLevelUpModal();
      }
      saveData();
      updateProfile();
    }

    function showLevelUpModal() {
      document.getElementById('levelUpMsg').textContent = `축하합니다! LV. ${level} 용사로 성장했습니다!\n다음 레벨 필요 경험치: ${getMaxExp()} EXP`;
      document.getElementById('levelUpModal').style.display = 'flex';
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('levelUpModal').style.display = 'none';
    });

    function clearQuest(index) {
      const q = quests[index];
      if (q.completed) return;

      q.completed = true;
      gainExp(q.exp);

      if (q.type === 'once') {
        quests.splice(index, 1);
      }

      saveData();
      renderQuests();
    }

    function deleteQuest(index) {
      quests.splice(index, 1);
      saveData();
      renderQuests();
    }

    document.getElementById('addBtn').addEventListener('click', () => {
      const input = document.getElementById('questInput');
      const text = input.value.trim();
      if (!text) return;

      quests.push({
        text: text,
        type: selectedType,
        exp: selectedDiff,
        completed: false
      });

      saveData();
      renderQuests();
      input.value = '';
    });

    document.getElementById('questInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('addBtn').click();
    });

    checkDailyReset();
    updateProfile();
    renderQuests();
  </script>
</body>
</html>
